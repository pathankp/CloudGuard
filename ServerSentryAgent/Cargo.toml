[package]
name = "ServerSentryAgent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.10", default-features = false, features = ["json", "rustls-tls"] } # Using rustls-tls
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13.0" # Pinned, re-enabled default features
chrono = { version = "0.4.23", default-features = false, features = ["serde"] } # Pinned, specific features
rand = "0.8" # For generating mock data
dotenv = "0.15" # Re-added for .env file support
